<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance & Repair Log</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --card-hover: #1e222b;
    --border: #2a2f3a;
    --text: #e8eaed;
    --text-dim: #9aa3b2;
    --accent: #4f8cff;
    --accent-dim: #2c4a7c;
    --success: #2e7d5b;
    --success-bg: #163a2c;
    --danger: #d15353;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  .subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 16px; }
  .banner {
    background: var(--success-bg);
    color: #8fe0bb;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .banner.live { background: #1c2e4a; color: #9cc2ff; }
  input[type="text"], textarea, select {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
  }
  input[type="text"]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .search-box { margin-bottom: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .card:hover { background: var(--card-hover); }
  .card-title { font-weight: 600; font-size: 16px; }
  .card-sub { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 14px;
    cursor: pointer;
  }
  .info-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .info-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid var(--border); }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: var(--text-dim); }
  .info-value { text-align: right; max-width: 60%; }
  .section-title { font-size: 15px; font-weight: 600; margin: 20px 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .log-entry {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .log-date { font-size: 12px; color: var(--accent); font-weight: 600; }
  .log-type { font-size: 12px; color: var(--text-dim); float: right; }
  .log-desc { margin: 6px 0; font-size: 14px; line-height: 1.5; }
  .log-meta { font-size: 12px; color: var(--text-dim); }
  .empty { color: var(--text-dim); text-align: center; padding: 30px 0; font-size: 14px; }
  .btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  .btn:active { background: var(--accent-dim); }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg);
    border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    width: 100%;
    max-width: 640px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal h2 { margin: 0 0 14px; font-size: 18px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 5px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions .btn { flex: 1; }
  .loading { text-align: center; color: var(--text-dim); padding: 40px 0; font-size: 14px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--success-bg); color: #8fe0bb;
    padding: 12px 20px; border-radius: 10px; font-size: 14px;
    z-index: 200; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .toast.error { background: #3a1c1c; color: #ff9d9d; }
  .fab {
    position: sticky; bottom: 12px; margin-top: 10px;
  }
  .part-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .part-row-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .part-name { font-weight: 600; font-size: 14px; }
  .part-status {
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .status-good { background: #163a2c; color: #8fe0bb; }
  .status-warn { background: #4a3a16; color: #f0c674; }
  .status-overdue { background: #3a1c1c; color: #ff9d9d; }
  .status-unknown { background: #2a2f3a; color: #9aa3b2; }
  .status-pending { background: #1c2e4a; color: #9cc2ff; }
  .pending-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .pending-row .part-name { font-size: 14px; }
  .pending-row .btn {
    width: auto;
    padding: 8px 12px;
    font-size: 13px;
    flex-shrink: 0;
  }
  .ps-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .ps-card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .ps-detail {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .ps-detail b { color: var(--text); font-weight: 500; }
  .part-row select, .part-row input {
    margin-top: 6px;
    font-size: 13px;
    padding: 8px 10px;
  }
  .part-badge {
    display: inline-block;
    background: var(--danger);
    color: white;
    font-size: 10px;
    font-weight: 700;
    border-radius: 10px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: middle;
  }
</style>
</head>
<body>

      </div>

<script>
const SHEET_ID = '1ZISQ2C3IenpK7nQ8JJ7f6Jott5cTXA4pDcPmVINt73U';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbybNruqSLPqkIhIONnsaI6TfivRogBNN5a6w5UpI_mf4TJbopm8-_uQrePTo_ya78PH/exec';

const MACHINES_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Machines&range=A5:F212`;
const LOGS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=All_Data&range=A2:M2000`;
const BOM_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('BOM')}&range=A3:E2000`;
const PART_STATUS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('Part Status')}&range=A3:E2000`;

let MACHINES = [];
let LOGS = [];
let BOM = [];
let PART_STATUS = {}; // key: machineName + '|' + partId -> {lastReplaced, lastInspected}
let currentMachineId = null;

function slugify(name) {
  if (!name) return '';
  return String(name).trim().toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '');
}

// Robust CSV parser (handles quoted fields with commas/newlines/escaped quotes)
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else { field += c; }
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v !== undefined && v !== ''));
}

async function fetchCSV(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('fetch failed: ' + res.status);
  return parseCSV(await res.text());
}

async function loadData() {
  const [machineRows, logRows, bomRows, statusRows] = await Promise.all([
    fetchCSV(MACHINES_URL),
    fetchCSV(LOGS_URL),
    fetchCSV(BOM_URL).catch(() => []),
    fetchCSV(PART_STATUS_URL).catch(() => [])
  ]);

  const seen = {};
  MACHINES = machineRows
    .filter(r => r[1] && String(r[1]).trim())
    .map(r => {
      const name = String(r[1]).trim();
      let id = slugify(name);
      let base = id, n = 2;
      while (seen[id]) { id = base + '-' + n; n++; }
      seen[id] = true;
      return {
        id,
        name,
        equipmentId: (r[2] || '').trim(),
        manufacturer: (r[3] || '').trim(),
        location: (r[4] || '').trim(),
        warranty: (r[5] || '').trim(),
      };
    });

  const nameToId = {};
  MACHINES.forEach(m => { nameToId[m.name] = m.id; });

  LOGS = logRows
    .filter(r => r[0] && String(r[0]).trim())
    .map(r => {
      const machineName = String(r[0]).trim();
      let mid = nameToId[machineName];
      if (!mid) {
        mid = slugify(machineName);
        // register as extra machine so it's still reachable/directory-visible
        if (!MACHINES.find(m => m.id === mid)) {
          MACHINES.push({ id: mid, name: machineName, equipmentId: '', manufacturer: '', location: r[9] || '', warranty: '' });
        }
      }
      return {
        machineId: mid,
        machineName,
        date: (r[1] || '').trim(),
        typeOfService: (r[2] || '').trim(),
        description: (r[3] || '').trim(),
        serviceProvider: (r[4] || '').trim(),
        cost: (r[5] || '').trim(),
        performedBy: (r[6] || '').trim(),
        notes: (r[8] || '').trim(),
      };
    });

  BOM = bomRows
    .filter(r => r[0] && r[1] && String(r[0]).trim() && String(r[1]).trim())
    .map(r => ({
      machineName: String(r[0]).trim(),
      partId: String(r[1]).trim(),
      partName: (r[2] || '').trim() || r[1].trim(),
      qty: (r[3] || '').toString().trim(),
      intervalDays: parseInt(r[4], 10) || 0,
    }));

  PART_STATUS = {};
  statusRows
    .filter(r => r[0] && r[1] && String(r[0]).trim() && String(r[1]).trim())
    .forEach(r => {
      const key = String(r[0]).trim() + '|' + String(r[1]).trim();
      PART_STATUS[key] = {
        lastReplaced: (r[2] || '').trim(),
        lastInspected: (r[3] || '').trim(),
        inService: (r[4] || '').trim(),
      };
    });
}

function computePartStatus(partId, machineName, intervalDays) {
  const key = machineName + '|' + partId;
  const st = PART_STATUS[key];
  const lastReplaced = st ? st.lastReplaced : '';
  const base = { lastReplaced: lastReplaced || '', inService: (st && st.inService) || '', daysSince: null };

  if (!lastReplaced) return Object.assign(base, { label: 'ยังไม่มีประวัติเปลี่ยน', cls: 'status-unknown', overdue: false, pending: false });
  const lastTime = parseDate(lastReplaced);
  if (!lastTime) return Object.assign(base, { label: 'ยังไม่มีประวัติเปลี่ยน', cls: 'status-unknown', overdue: false, pending: false });

  const inService = st.inService || '';
  const inServiceTime = parseDate(inService);
  if (!inServiceTime) {
    // Replaced but not yet put into service — the aging clock hasn't started.
    return Object.assign(base, { label: 'ติดตั้งแล้ว รอใช้งาน', cls: 'status-pending', overdue: false, pending: true });
  }

  const daysSince = Math.floor((Date.now() - inServiceTime) / 86400000);
  base.daysSince = daysSince;
  if (!intervalDays) return Object.assign(base, { label: `ใช้งานมาแล้ว ${daysSince} วัน`, cls: 'status-good', overdue: false, pending: false });
  const ratio = daysSince / intervalDays;
  if (ratio >= 1) return Object.assign(base, { label: `เกินกำหนด (${daysSince}/${intervalDays} วัน)`, cls: 'status-overdue', overdue: true, pending: false });
  if (ratio >= 0.8) return Object.assign(base, { label: `ใกล้ครบรอบ (${daysSince}/${intervalDays} วัน)`, cls: 'status-warn', overdue: false, pending: false });
  return Object.assign(base, { label: `ปกติ (${daysSince}/${intervalDays} วัน)`, cls: 'status-good', overdue: false, pending: false });
}

function getParam() {
  return new URLSearchParams(location.search).get('m');
}

function navigate(id) {
  const url = id ? `${location.pathname}?m=${encodeURIComponent(id)}` : location.pathname;
  history.pushState({}, '', url);
  render();
  window.scrollTo(0, 0);
}

window.addEventListener('popstate', render);

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderDirectory(filterText) {
  const app = document.getElementById('app');
  const q = (filterText || '').toLowerCase();
  const filtered = MACHINES.filter(m =>
    !q || m.name.toLowerCase().includes(q) || m.equipmentId.toLowerCase().includes(q) || m.location.toLowerCase().includes(q)
  );

  app.innerHTML = `
    <h1>Maintenance &amp; Repair Log</h1>
    <div class="subtitle">บันทึกซ่อมบำรุงเครื่องจักร (SD Guthrie)</div>
    <div class="banner live">🔴 ข้อมูลอัปเดตแบบเรียลไทม์</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ค้นหาเครื่องจักร / Equipment ID / Location..." value="${escapeHtml(filterText || '')}">
    </div>
    <div id="machineList"></div>
  `;

  const listEl = document.getElementById('machineList');
  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="empty">ไม่พบเครื่องจักรที่ค้นหา</div>`;
  } else {
    listEl.innerHTML = filtered.map(m => `
      <div class="card" data-id="${escapeHtml(m.id)}">
        <div class="card-title">${escapeHtml(m.name)}</div>
        <div class="card-sub">${escapeHtml(m.equipmentId || '-')} · ${escapeHtml(m.location || '-')}</div>
      </div>
    `).join('');
    listEl.querySelectorAll('.card').forEach(el => {
      el.addEventListener('click', () => navigate(el.dataset.id));
    });
  }

  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', (e) => renderDirectory(e.target.value));
  if (filterText) {
    searchInput.focus();
    searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
  }
}

function renderMachine(id) {
  const app = document.getElementById('app');
  const machine = MACHINES.find(m => m.id === id);
  currentMachineId = id;

  if (!machine) {
    app.innerHTML = `
      <a class="back-link" id="backLink">← กลับหน้ารายการ</a>
      <div class="empty">ไม่พบเครื่องจักรนี้ในระบบ</div>
    `;
    document.getElementById('backLink').addEventListener('click', () => navigate(null));
    return;
  }

  const logs = LOGS.filter(l => l.machineId === id).sort((a, b) => {
    const da = parseDate(a.date), db = parseDate(b.date);
    return (db || 0) - (da || 0);
  });

  const machineParts = BOM.filter(b => b.machineName === machine.name);
  const partsWithStatus = machineParts.map(p => ({ p, st: computePartStatus(p.partId, machine.name, p.intervalDays) }));
  const overdueParts = partsWithStatus.filter(x => x.st.overdue);
  const pendingParts = partsWithStatus.filter(x => x.st.pending);

  app.innerHTML = `
    <a class="back-link" id="backLink">← กลับหน้ารายการ</a>
    <h1>${escapeHtml(machine.name)}</h1>
    <div class="subtitle">${escapeHtml(machine.equipmentId || '-')}</div>
    <div class="info-card">
      <div class="info-row"><span class="info-label">Equipment ID (SAP)</span><span class="info-value">${escapeHtml(machine.equipmentId || '-')}</span></div>
      <div class="info-row"><span class="info-label">Manufacturer/Model</span><span class="info-value">${escapeHtml(machine.manufacturer || '-')}</span></div>
      <div class="info-row"><span class="info-label">Location/Department</span><span class="info-value">${escapeHtml(machine.location || '-')}</span></div>
      <div class="info-row"><span class="info-label">Warranty Expiration</span><span class="info-value">${escapeHtml(machine.warranty || '-')}</span></div>
    </div>
    ${overdueParts.length > 0 ? `
      <div class="banner" style="background:#3a1c1c;color:#ff9d9d;">
        ⚠️ มี ${overdueParts.length} part ที่เกินกำหนดเปลี่ยนแล้ว: ${overdueParts.map(x => escapeHtml(x.p.partName)).join(', ')}
      </div>
    ` : ''}
    ${pendingParts.length > 0 ? `
      <div class="section-title">Part ที่เปลี่ยนไว้แล้ว รอเริ่มใช้งาน</div>
      <div id="pendingPartsList">
        ${pendingParts.map(x => `
          <div class="pending-row" data-part-id="${escapeHtml(x.p.partId)}" data-part-name="${escapeHtml(x.p.partName)}">
            <span class="part-name">${escapeHtml(x.p.partName)}</span>
            <button class="btn put-in-service-btn" type="button">เริ่มใช้งาน</button>
          </div>
        `).join('')}
      </div>
    ` : ''}
    ${partsWithStatus.length > 0 ? `
      <div class="section-title">สถานะอะไหล่ (${partsWithStatus.length} รายการ)</div>
      <div id="partStatusList">
        ${partsWithStatus.map(x => `
          <div class="ps-card">
            <div class="ps-card-head">
              <span class="part-name">${escapeHtml(x.p.partName)}${x.st.overdue ? '<span class="part-badge">เกินกำหนด</span>' : ''}</span>
              <span class="part-status ${x.st.cls}">${escapeHtml(x.st.label)}</span>
            </div>
            <div class="ps-detail">
              <span>เปลี่ยนล่าสุด: <b>${escapeHtml(x.st.lastReplaced || '-')}</b></span>
              <span>เริ่มใช้งาน: <b>${escapeHtml(x.st.inService || (x.st.pending ? 'ยังไม่เริ่ม' : '-'))}</b></span>
              ${x.st.daysSince !== null ? `<span>ใช้งานมาแล้ว: <b>${x.st.daysSince} วัน</b></span>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    ` : ''}
    <div class="fab"><button class="btn" id="addLogBtn">+ เพิ่ม Log ซ่อมบำรุง</button></div>
    <div class="section-title">ประวัติซ่อมบำรุง (${logs.length} รายการ)</div>
    <div id="logList">
      ${logs.length === 0 ? `<div class="empty">ยังไม่มีประวัติซ่อมบำรุง</div>` : logs.map(l => `
        <div class="log-entry">
          <span class="log-type">${escapeHtml(l.typeOfService || '-')}</span>
          <span class="log-date">${escapeHtml(l.date || '-')}</span>
          <div class="log-desc">${escapeHtml(l.description || '-')}</div>
          <div class="log-meta">${escapeHtml(l.serviceProvider || '-')} · ${escapeHtml(l.performedBy || '-')}${l.notes ? ' · ' + escapeHtml(l.notes) : ''}</div>
        </div>
      `).join('')}
    </div>
  `;

  document.getElementById('backLink').addEventListener('click', () => navigate(null));
  document.getElementById('addLogBtn').addEventListener('click', () => openModal(machine));
  document.querySelectorAll('.put-in-service-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const row = e.target.closest('.pending-row');
      openPisModal(machine, row.dataset.partId, row.dataset.partName);
    });
  });
}

let pisTarget = null; // { machine, partId, partName }

function openPisModal(machine, partId, partName) {
  pisTarget = { machine, partId, partName };
  document.getElementById('pisForm').reset();
  document.getElementById('pisTarget').textContent = `${machine.name} — ${partName}`;
  const today = new Date();
  document.getElementById('pis_date').value = `${today.getDate()}/${today.getMonth()+1}/${today.getFullYear()}`;
  document.getElementById('pis_desc').value = `เริ่มใช้งาน ${partName}`;
  document.getElementById('pisOverlay').classList.add('open');
}

function closePisModal() {
  document.getElementById('pisOverlay').classList.remove('open');
  pisTarget = null;
}

document.getElementById('pisCancelBtn').addEventListener('click', closePisModal);
document.getElementById('pisOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'pisOverlay') closePisModal();
});

document.getElementById('pisForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!pisTarget) return;
  const { machine, partId, partName } = pisTarget;

  const payload = {
    requestType: 'putInService',
    machineName: machine.name,
    partId,
    partName,
    date: document.getElementById('pis_date').value,
    typeOfService: document.getElementById('pis_type').value,
    description: document.getElementById('pis_desc').value,
    serviceProvider: document.getElementById('pis_provider').value,
    performedBy: document.getElementById('pis_performed').value,
    notes: document.getElementById('pis_notes').value,
    location: machine.location,
  };

  const submitBtn = document.getElementById('pisSubmitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'กำลังบันทึก...';

  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    closePisModal();
    showToast(`เริ่มนับอายุการใช้งาน: ${partName}`);
    await loadData();
    renderMachine(currentMachineId);
  } catch (err) {
    showToast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง', true);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'บันทึก';
  }
});

function parseDate(s) {
  if (!s) return 0;
  const m = String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (!m) return 0;
  return new Date(+m[3], +m[2] - 1, +m[1]).getTime();
}

function openModal(machine) {
  currentMachineId = machine.id;
  document.getElementById('logForm').reset();
  const today = new Date();
  document.getElementById('f_date').value = `${today.getDate()}/${today.getMonth()+1}/${today.getFullYear()}`;

  const parts = BOM.filter(b => b.machineName === machine.name);
  const wrap = document.getElementById('partsFieldWrap');
  const list = document.getElementById('partsList');

  if (parts.length === 0) {
    wrap.style.display = 'none';
    list.innerHTML = '';
  } else {
    wrap.style.display = 'block';
    list.innerHTML = parts.map(p => {
      const st = computePartStatus(p.partId, machine.name, p.intervalDays);
      return `
        <div class="part-row" data-part-id="${escapeHtml(p.partId)}" data-part-name="${escapeHtml(p.partName)}">
          <div class="part-row-head">
            <span class="part-name">${escapeHtml(p.partName)}${st.overdue ? '<span class="part-badge">เกินกำหนด</span>' : ''}</span>
            <span class="part-status ${st.cls}">${escapeHtml(st.label)}</span>
          </div>
          <select class="part-action">
            <option value="none">ไม่ได้ตรวจรอบนี้</option>
            <option value="inspected">ตรวจแล้ว — สภาพดี (ไม่เปลี่ยน)</option>
            <option value="replaced">เปลี่ยน (ใช้งานทันที)</option>
            <option value="replaced-standby">เปลี่ยน-สำรองไว้ (ยังไม่ใช้งาน)</option>
          </select>
          <input type="text" class="part-qty" placeholder="จำนวนที่ใช้ (ถ้าเลือกเปลี่ยน)" value="${escapeHtml(p.qty)}">
          <input type="text" class="part-note" placeholder="หมายเหตุสภาพ (ถ้ามี)">
        </div>
      `;
    }).join('');
  }

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});

function showToast(msg, isError) {
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

document.getElementById('logForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const machine = MACHINES.find(m => m.id === currentMachineId);
  if (!machine) return;

  const partActions = [];
  document.querySelectorAll('#partsList .part-row').forEach(row => {
    const action = row.querySelector('.part-action').value;
    if (action === 'none') return;
    let actionLabel;
    if (action === 'replaced') actionLabel = 'Replaced';
    else if (action === 'replaced-standby') actionLabel = 'Replaced - Standby';
    else actionLabel = 'Inspected - Good Condition';
    partActions.push({
      partId: row.dataset.partId,
      partName: row.dataset.partName,
      action: actionLabel,
      qty: row.querySelector('.part-qty').value,
      notes: row.querySelector('.part-note').value
    });
  });

  const payload = {
    machineName: machine.name,
    date: document.getElementById('f_date').value,
    typeOfService: document.getElementById('f_type').value,
    description: document.getElementById('f_desc').value,
    serviceProvider: document.getElementById('f_provider').value,
    performedBy: document.getElementById('f_performed').value,
    notes: document.getElementById('f_notes').value,
    location: machine.location,
    cost: '',
    partActions
  };

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'กำลังบันทึก...';

  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    // Apps Script's response may be opaque depending on browser/CORS state;
    // treat a non-throwing fetch as success. Reload everything (logs + part
    // status) from the sheet so part statuses/stock reflect what was just written.
    closeModal();
    showToast('บันทึก Log สำเร็จ');
    await loadData();
    renderMachine(currentMachineId);
  } catch (err) {
    showToast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง', true);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'บันทึก';
  }
});

function render() {
  const id = getParam();
  if (id) renderMachine(id);
  else renderDirectory();
}

async function init() {
  try {
    await loadData();
    render();
  } catch (err) {
    document.getElementById('app').innerHTML = `
      <h1>Maintenance & Repair Log</h1>
      <div class="empty">โหลดข้อมูลไม่สำเร็จ (${escapeHtml(err.message)})<br><br>
      <button class="btn" onclick="location.reload()">ลองใหม่</button></div>
    `;
  }
}

init();
</script>
</body>
</html>
