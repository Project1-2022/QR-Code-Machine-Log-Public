<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Maintenance & Repair Log</title>
<style>
  :root{
    --bg:#f4f6f5; --card:#ffffff; --ink:#1c2b28; --sub:#5b6b67;
    --line:#e2e8e5; --accent:#2f7a5e; --accent-dark:#215c46; --accent-soft:#e8f3ee;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121816; --card:#1b2320; --ink:#eef3f1; --sub:#9fb0ab;
      --line:#2b3532; --accent:#4fae86; --accent-dark:#6fc79f; --accent-soft:#1e2f28;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121816; --card:#1b2320; --ink:#eef3f1; --sub:#9fb0ab;
    --line:#2b3532; --accent:#4fae86; --accent-dark:#6fc79f; --accent-soft:#1e2f28;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px;}
  header{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  header .title{font-size:18px;font-weight:700;flex:1;min-width:180px;}
  header .title small{display:block;font-weight:400;font-size:12px;color:var(--sub);}
  .notice{font-size:12px;color:var(--sub);background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-bottom:14px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;
  }
  input[type=search]{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);font-size:14px;font-family:inherit;
  }
  .search-row{display:flex;gap:8px;margin-bottom:12px;}
  .mlist{display:flex;flex-direction:column;gap:8px;}
  .mrow{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);
    cursor:pointer;
  }
  .mrow:active{background:var(--accent-soft);}
  .mrow .name{font-weight:700;font-size:14.5px;}
  .mrow .meta{font-size:12px;color:var(--sub);margin-top:2px;}
  .chev{color:var(--sub);font-size:18px;}
  .empty{color:var(--sub);text-align:center;padding:30px 10px;font-size:14px;}
  .infogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;}
  @media (max-width:480px){.infogrid{grid-template-columns:1fr;}}
  .info-item .k{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;}
  .info-item .v{font-size:14.5px;font-weight:600;margin-top:2px;word-break:break-word;}
  .section-title{font-size:15px;font-weight:700;margin:22px 0 10px;}
  .logentry{
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card);
  }
  .logentry .row1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;}
  .logentry .date{font-weight:700;font-size:13.5px;}
  .tag{
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);
    color:var(--accent-dark);white-space:nowrap;
  }
  .logentry .desc{font-size:13.5px;margin-top:6px;white-space:pre-wrap;}
  .logentry .foot{font-size:12px;color:var(--sub);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap;}
  .backlink{display:flex;align-items:center;gap:6px;color:var(--accent-dark);font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:10px;}
</style>
</head>

const SNAPSHOT_DATE = "17 Sep 2026";

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function getParam(){
  return new URLSearchParams(location.search).get('m');
}
function navigate(id){
  const url = id ? ('?m=' + encodeURIComponent(id)) : location.pathname;
  history.pushState({}, '', url);
  render();
}
window.addEventListener('popstate', render);

function header(){
  return '<header><div class="title">Maintenance &amp; Repair Log<small>บันทึกซ่อมบำรุงเครื่องจักร (SD Guthrie)</small></div></header>' +
    '<div class="notice">ข้อมูล ณ วันที่ ' + esc(SNAPSHOT_DATE) + ' — หน้านี้เป็น snapshot แบบดูอย่างเดียว หากมี Log ใหม่ให้ปรับปรุงในไฟล์ Excel ต้นทาง</div>';
}

function render(){
  const app = document.getElementById('app');
  const id = getParam();
  if(id){
    renderMachine(id);
  }else{
    renderDirectory();
  }
}

function renderDirectory(){
  const app = document.getElementById('app');
  app.innerHTML = header() + '<div class="search-row"><input id="search" type="search" placeholder="ค้นหาเครื่องจักร / Equipment ID / Location..."></div><div id="mlist" class="mlist"></div>';
  const listEl = document.getElementById('mlist');
  function draw(filter){
    const f = (filter||'').trim().toLowerCase();
    const items = MACHINES.filter(m => !f ||
      (m.name||'').toLowerCase().includes(f) ||
      (m.equipmentId||'').toLowerCase().includes(f) ||
      (m.location||'').toLowerCase().includes(f));
    if(items.length===0){
      listEl.innerHTML = '<div class="empty">ไม่พบเครื่องจักรที่ตรงกับคำค้นหา</div>';
      return;
    }
    listEl.innerHTML = items.map(m => (
      '<div class="mrow" data-id="' + esc(m.id) + '">' +
      '<div><div class="name">' + esc(m.name) + '</div>' +
      '<div class="meta">' + esc(m.equipmentId || 'ไม่มี Equipment ID') + (m.location ? ' · ' + esc(m.location) : '') + '</div></div>' +
      '<div class="chev">&rsaquo;</div></div>'
    )).join('');
    listEl.querySelectorAll('.mrow').forEach(el=>{
      el.addEventListener('click', ()=> navigate(el.getAttribute('data-id')));
    });
  }
  draw('');
  document.getElementById('search').addEventListener('input', e => draw(e.target.value));
}

function renderMachine(id){
  const app = document.getElementById('app');
  const machine = MACHINES.find(m => m.id === id);
  const logs = LOGS.filter(l => l.machineId === id).sort((a,b) => (b.date||'').localeCompare(a.date||''));
  app.innerHTML = header() +
    '<div class="backlink" id="backBtn">&lsaquo; กลับไปรายชื่อเครื่องจักรทั้งหมด</div>' +
    '<div class="card">' + (machine ? (
      '<div class="infogrid">' +
      '<div class="info-item"><div class="k">Asset Name / Description</div><div class="v">' + esc(machine.name) + '</div></div>' +
      '<div class="info-item"><div class="k">Equipment ID (SAP)</div><div class="v">' + (esc(machine.equipmentId)||'-') + '</div></div>' +
      '<div class="info-item"><div class="k">Manufacturer / Model</div><div class="v">' + (esc(machine.manufacturer)||'-') + '</div></div>' +
      '<div class="info-item"><div class="k">Location / Department</div><div class="v">' + (esc(machine.location)||'-') + '</div></div>' +
      '<div class="info-item"><div class="k">Warranty Expiration</div><div class="v">' + (esc(machine.warranty)||'-') + '</div></div>' +
      '</div>'
    ) : '<div class="empty">ไม่พบข้อมูลเครื่องจักรนี้ในระบบ (ID: ' + esc(id) + ')</div>') + '</div>' +
    '<div class="section-title">Maintenance and Repair Record</div>' +
    '<div id="logList"></div>';
  document.getElementById('backBtn').addEventListener('click', ()=> navigate(null));
  const el = document.getElementById('logList');
  if(logs.length===0){
    el.innerHTML = '<div class="empty">ยังไม่มีประวัติการซ่อมบำรุงสำหรับเครื่องจักรนี้</div>';
    return;
  }
  el.innerHTML = logs.map(l => (
    '<div class="logentry"><div class="row1"><div class="date">' + (esc(l.date)||'-') + '</div>' +
    (l.typeOfService ? '<div class="tag">' + esc(l.typeOfService) + '</div>' : '') + '</div>' +
    (l.description ? '<div class="desc">' + esc(l.description) + '</div>' : '') +
    '<div class="foot">' +
    (l.serviceProvider ? '<span>ผู้ให้บริการ: ' + esc(l.serviceProvider) + '</span>' : '') +
    (l.performedBy ? '<span>' + esc(l.performedBy) + '</span>' : '') +
    (l.cost ? '<span>ค่าใช้จ่าย: ' + esc(l.cost) + '</span>' : '') +
    '</div>' +
    (l.notes ? '<div class="foot" style="margin-top:4px;">หมายเหตุ: ' + esc(l.notes) + '</div>' : '') +
    '</div>'
  )).join('');
}

render();
</script>
